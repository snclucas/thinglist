<!-- html -->
{% extends "base.html" %}

{% block content %}
<style>
  .error-viewport {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1rem;
    text-align: center;
  }
  .error-card {
    max-width: 780px;
    border-radius: 12px;
    padding: 2rem;
    box-shadow: 0 8px 30px rgba(20,20,30,0.08);
    background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(250,250,255,0.9));
  }
  .hero-404 { width: 160px; height: 160px; margin: 0 auto 1rem; display:block; }
  .float {
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
    100% { transform: translateY(0); }
  }
  .muted-path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:0.9rem; color:#6c6f76; }
  .search-inline { display:inline-flex; gap:0.5rem; align-items:center; margin-top:0.8rem; }
  .search-inline .form-control { min-width:220px; }
  .suggestions { margin-top:1rem; font-size:0.95rem; color:#5b616b; }
</style>

<div class="error-viewport">
  <div class="error-card">
    <!-- Simple illustrative 404 SVG (no external assets) -->
    <svg class="hero-404 float" viewBox="0 0 200 200" role="img" aria-labelledby="titledesc">
      <title id="titledesc">Lost box and magnifier</title>
      <defs>
        <linearGradient id="g" x1="0" x2="1">
          <stop offset="0" stop-color="#6f9efc"/>
          <stop offset="1" stop-color="#7be3c7"/>
        </linearGradient>
      </defs>
      <rect x="12" y="40" width="176" height="120" rx="14" fill="url(#g)" opacity="0.12"/>
      <g transform="translate(20,28)">
        <rect x="6" y="14" width="92" height="64" rx="8" fill="#fff" stroke="#dfe6f6" stroke-width="3"/>
        <circle cx="116" cy="42" r="24" fill="#fff" stroke="#dfe6f6" stroke-width="3"/>
        <path d="M129 55 L155 81" stroke="#c7d6fb" stroke-width="6" stroke-linecap="round"/>
        <text x="18" y="54" fill="#374151" font-size="22" font-weight="700">404</text>
      </g>
    </svg>

    <h3 class="display-5 fw-bold mb-1">No thing found :(</h3>
    <p class="fs-5"><span class="text-danger">{{ message or "We couldn't find that page." }}</span></p>

    <div class="suggestions">

      <ul class="list-inline mt-2 mb-0">
          <li class="list-inline-item"><a href="{{ url_for('main.profile', username=current_user.username) | replace('%40', '@') }}">Home</a></li>
      </ul>
    </div>
  </div>
</div>
{% endblock %}
