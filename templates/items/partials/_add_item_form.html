<h5>Add new item:</h5>
<hr>
<br>

<form class="row g-3" method="post" action="{{ url_for('inv.add_to_list_endpoint') }}">

    <div class="row">
        <div class="col-12">
            <label for="form_item_name" class="form-label">Item name:</label>
            <input type="text" class="form-control" name="name" id="form_item_name" required>
        </div>
        <div class="col-12">
            <label for="form_item_description" class="form-label">Item description:</label>
            <input type="text" class="form-control" name="description" id="form_item_description">
        </div>
    </div>

    <hr>

    <div class="row">

        <div class="col-6">
            <label class="form-label" for="types_autocomplete_add_form">Type:</label>
            <input id="types_autocomplete_add_form" name="type" type="text" class="form-control"
                   value="{{ item_type if item_type is defined else '' }}">
        </div>
        <div class="col-6">
            <label class="form-label" for="quantity">Quantity:</label>
            <input id="quantity" name="quantity" type="number" class="form-control" value="1">
        </div>
    </div>

    <hr>
    <div class="row">
        <div class="col-6">

            <label class="form-label" for="item_location">Location:</label>
            <select class="form-select" id="item_location" name="location_id">
                {% if user_locations is defined and user_locations %}
                    {% for user_location_option in user_locations %}
                        {% if __DEFAULT__ in user_location_option.name %}
                            {% set location_name = "Default/None set" %}
                        {% else %}
                            {% set location_name = user_location_option['name'] %}
                        {% endif %}
                        <option value="{{ user_location_option.id }}">{{ location_name}}</option>
                    {% endfor %}
                {% else %}
                    <option value="">Any</option>
                {% endif %}
            </select>

        </div>
        <div class="col-6">
            <label for="form_item_specific_location" class="form-label">Specific location:</label>
            <input type="text" class="form-control" name="specific_location" id="form_item_specific_location">
        </div>
    </div>
    <hr>

    <div class="row">
        <div class="col-12">
            <label class="form-label" for="form_item_tags">Tags:</label>
            <input type="text" class="form-control" name="tags" id="form_item_tags">
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <label class="form-label" for="form_item_url">URL</label>
            <input type="text" class="form-control" name="url" id="form_item_url">
        </div>
    </div>

    {% if inventory_field_template is defined and inventory_field_template.fields %}
        {% for field in inventory_field_template.fields %}
            <div class="row">
                <div class="col-12">

                    <label for="form_item_{{ field.field }}" class="form-label">{{ field.field }}</label>

                    {% if field.type == "input" %}
                        <input type="text" class="form-control" name="{{ field.field }}" id="form_item_{{ field.field }}"
                               placeholder=""
                               value="{{ field.value }}">
                    {% elif field.type == "textarea" %}
                        <textarea class="form-control" name="{{ field.field }}" id="form_item_{{ field.field }}" rows="4"
                                  cols="50">{{ field.value }}</textarea>
                    {% elif field.type == "bool" %}
                        <select class="form-select" name="{{ field.field }}" id="form_item_{{ field.field }}">
                            <option value=1 selected>True</option>
                            <option value=0>False</option>
                        </select>
                    {% endif %}

                </div>
            </div>
        {% endfor %}
    {% endif %}


    <input type="hidden" class="form-control" name="username" id="form_username" value="{{ list_username if list_username is defined else '' }}">
    <input type="hidden" class="form-control" name="id" id="form_item_id" value="-1">
    <input type="hidden" class="form-control" name="inventory_id" id="form_inventory_id" value="{{ inventory.id if inventory is defined else '' }}">
    <input type="hidden" class="form-control" name="inventory_slug" id="form_inventory_slug"
           value="{{ inventory.slug if inventory is defined else '' }}">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-12">
        <button type="submit" class="btn btn-primary">Save</button>
        <button class="btn btn-primary" id="add_item_cancel_btn">Cancel</button>
    </div>
</form>
