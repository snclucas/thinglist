<script>
    (function () {
  // Helpers
  const escapeHtml = (str = '') =>
    String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

  const truncate = (input = '') =>
    input.length > 5 ? `${input.substring(0, 5)}...` : input;

  // Build URL (Jinja `tojson` produces a quoted string)
  const urlParamsString = typeof urlParams !== 'undefined' ? urlParams.toString() : '';
  const userItemsUrl = {{ url_for('api.items', username=list_username, inventory_slug=inventory_slug) | tojson | safe }} + (urlParamsString ? '?' + urlParamsString : '');

  // Template for item URL, replace ITEMSSLUG safely
  const itemUrlTemplate = {{ url_for('item.item_with_username_and_inventory', list_username=list_username, inventory_slug=inventory_slug, item_slug='ITEMSSLUG') | tojson }};

  // Construct columnDefs and columns with Jinja sections preserved but valid JS
  const columnDefs = [
    {
      // Item name
      targets: 'coldef-name',
      searchable: true,
      render: function (data, type, row) {
        const itemSlug = row.slug || row['slug'] || '';
        const itemUrl = itemUrlTemplate.replace('ITEMSSLUG', encodeURIComponent(itemSlug));
        return `<a href="${itemUrl}">${escapeHtml(row.name || data || '')}</a>`;
      }
    },
    {% if inv_table_type == __LIST_ALL__ %}
    // (no extra defs here for LIST_ALL)
    {% else %}
    // (other conditional defs can go here)
    {% endif %}
    {
      // Item tags
      targets: 'coldef-tags',
      searchable: true,
      render: function (tagArray) {
        if (!Array.isArray(tagArray)) return '';
        return tagArray.map(tagText => {
          const href = "{{ url_for('items.items_with_username_and_inventory', list_username=list_username, inventory_slug=inventory_slug) | replace('%40', '@') }}" + '?tags=' + encodeURIComponent(tagText);
          return `<a href="${href}"><span class="tag_list">${escapeHtml(tagText)}</span></a>`;
        }).join(' ');
      }
    },
    {
      // Item type
      targets: 'coldef-type',
      searchable: true
    },
    {
      // Item description
      targets: 'coldef-desc',
      searchable: true,
      render: function (descriptionObj) {
        const desc = (descriptionObj && descriptionObj.description) ? descriptionObj.description : (descriptionObj || '');
        return escapeHtml(truncate(String(desc)));
      }
    },
    {% if user_is_authenticated %}
    {
      // Item inventories
      targets: 'coldef-inv',
      searchable: true,
      render: function (inventories) {
        return escapeHtml(String(inventories || ''));
      }
    },
    {% endif %}
    {
      // Item location
      targets: 'coldef-loc',
      searchable: true,
      render: function (locationDict) {
        const loc = locationDict && locationDict.location ? String(locationDict.location) : '';
        const specific = locationDict && locationDict.specific_location ? String(locationDict.specific_location) : '';
        let listLocation = "Default/None set";
        if (loc && !loc.includes("{{__DEFAULT__}}")) {
          listLocation = loc;
        }
        return specific && specific !== "None" ? `${escapeHtml(listLocation)}<br>${escapeHtml(specific)}` : escapeHtml(listLocation);
      }
    },
    {% if is_inventory_owner or inventory_access_level == __COLLABORATOR__ %}
    {
      // Checkbox column
      targets: 'coldef-checkboxes',
      sortable: false,
      className: 'dt-body-right',
      render: function (itemId) {
        const id = escapeHtml(String(itemId));
        return `<input class="form-check-input" type="checkbox" data-item-id="${id}" id="selected-item-${id}">`;
      }
    }
    {% endif %}
  ];

  const columns = [
    {name: 'coldef-name', data: 'name', width: '30px'},
    {% if inv_table_type == __LIST_ALL__ %}
    {name: 'coldef-desc', data: 'description', width: '20px'},
    {name: 'coldef-inv', data: 'inventories', width: '20px'},
    {name: 'coldef-loc', data: 'location', width: '20px'},
    {% else %}
    {name: 'coldef-type', data: 'type', width: '10px'},
    {name: 'coldef-loc', data: 'location', width: '20px'},
    {% endif %}
    {name: 'coldef-tags', data: 'tags', width: '20px'},
    {% if user_is_authenticated and (is_inventory_owner or inventory_access_level == __COLLABORATOR__) %}
    {name: 'coldef-checkboxes', data: 'id', width: '10px'}
    {% endif %}
  ];

  // Initialize DataTable
  const table = new DataTable('#items-table', {
    language: { emptyTable: 'No items :(' },
    searching: true,
    paging: true,
    ordering: true,
    info: true,
    rowReorder: true,
    colReorder: true,
    responsive: { details: false },
    stateSave: false,
    serverSide: true,
    pageLength: 25,
    columnDefs: columnDefs,
    columns: columns,
    processing: true,
    ajax: {
      url: userItemsUrl,
      type: 'GET',
      dataSrc: 'data',
      data: function (d) {
        d.view = "{{ view }}";
      },
      error: function (xhr, status, err) {
        console.error('Items ajax error', status, err, xhr.responseText);
      }
    }
  });

  // Delegated handler for checkboxes (works with server-side paging)
  document.addEventListener('change', function (e) {
    const el = e.target;
    if (el.matches && el.matches('input.form-check-input[data-item-id]')) {
      const itemId = el.getAttribute('data-item-id');
      // example action placeholder (toggle selection state, batch operations, etc.)
      console.log('item checkbox changed', itemId, el.checked);
    }
  });

})();

</script>
