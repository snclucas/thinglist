{% if data_dict | length > 0 %}
    <hr>
    <div>
        <table class="table collapse show display responsive nowrap compact" style="width:100%" id="items-table">
            <thead>
            <tr>
                <th data-priority="1">Name</th>
                <th class="min-phone-l">Description</th>
                <th class="min-phone-l">Tags</th>
                {% if user_is_authenticated %}
                    {% if is_inventory_owner or inventory_access_level == 1 %}
                        <th>
                            <input class="form-check-input" type="checkbox" value="" id="all-selected-items"> Page |
                            <input class="form-check-input" type="checkbox" value="" id="total-all-selected-items"> All
                        </th>
                    {% endif %}
                {% endif %}
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
{% else %}
    {% include 'items/list_partials/_empty_list_help.html' %}
{% endif %}
